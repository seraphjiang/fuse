<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fuse — Alerts</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f1117;color:#e1e4e8;min-height:100vh}
header{display:flex;align-items:center;padding:12px 24px;border-bottom:1px solid #21262d;background:#161b22}
header h1{font-size:18px;font-weight:600;color:#58a6ff}
.nav-tabs{display:flex;gap:0;margin-left:16px}.nav-tab{padding:8px 16px;font-size:13px;color:#8b949e;text-decoration:none;border-bottom:2px solid transparent}.nav-tab:hover{color:#e1e4e8}.nav-tab.active{color:#58a6ff;border-bottom-color:#58a6ff;font-weight:600}
main{max-width:960px;margin:0 auto;padding:24px}
.toolbar{display:flex;gap:12px;margin-bottom:16px;align-items:center}
.btn{padding:8px 16px;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#e1e4e8;font-size:13px;cursor:pointer;font-weight:500}
.btn:hover{border-color:#58a6ff}.btn-primary{background:#238636;border-color:#238636;color:#fff}.btn-primary:hover{background:#2ea043}
.btn-sm{padding:4px 10px;font-size:12px}
.stats{display:flex;gap:16px;margin-bottom:20px}
.stat-card{flex:1;background:#161b22;border:1px solid #21262d;border-radius:8px;padding:16px;text-align:center}
.stat-card .num{font-size:28px;font-weight:700;margin-bottom:4px}
.stat-card .label{font-size:11px;color:#8b949e;text-transform:uppercase}
.num-firing{color:#f85149}.num-rules{color:#58a6ff}.num-ack{color:#3fb950}
.card{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.card .icon{font-size:20px;flex-shrink:0}
.card .body{flex:1;min-width:0}
.card .body h4{font-size:13px;color:#e1e4e8;margin-bottom:2px}
.card .body .meta{font-size:11px;color:#484f58}
.badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;white-space:nowrap}
.badge-firing{background:#3a1a1a;color:#f85149}
.badge-ok{background:#1a3a2a;color:#3fb950}
.badge-ack{background:#1f3a5f;color:#58a6ff}
.empty{text-align:center;padding:48px;color:#484f58;font-size:14px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.timeline{border-left:2px solid #21262d;margin-left:12px;padding-left:16px}
.timeline .event{position:relative;margin-bottom:12px}
.timeline .event::before{content:'';position:absolute;left:-21px;top:6px;width:10px;height:10px;border-radius:50%;border:2px solid #0f1117}
.timeline .event.firing::before{background:#f85149}
.timeline .event.ok::before{background:#3fb950}
.timeline .event.ack::before{background:#58a6ff}
/* Light mode */
body.light{background:#fff;color:#1f2328}
body.light header{background:#f6f8fa;border-color:#d1d9e0}
body.light .card,.body.light .stat-card{background:#fff;border-color:#d1d9e0}
body.light input,body.light textarea,body.light select{background:#fff;color:#1f2328;border-color:#d1d9e0}
body.light .btn{background:#f6f8fa;color:#1f2328;border-color:#d1d9e0}
body.light .empty{color:#656d76}
body.light .meta{color:#656d76}
body.light .nav-tab{color:#656d76}
body.light .nav-tab.active{color:#0969da;border-bottom-color:#0969da}
/* Responsive */
@media(max-width:768px){main{padding:12px}header{flex-wrap:wrap;padding:8px 12px}.nav-tabs{flex-wrap:wrap}.toolbar{flex-wrap:wrap}.stats{flex-direction:column}}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:0">
    <h1>Fuse</h1>
    <nav class="nav-tabs">
      <a href="/playground" class="nav-tab">Playground</a>
      <a href="/dashboard" class="nav-tab">Dashboard</a>
      <a href="/status" class="nav-tab">Status</a>
      <a href="/alerts" class="nav-tab active">Alerts</a>
      <a href="/settings" class="nav-tab">Settings</a>
      <a href="/help" class="nav-tab">Help</a>
    </nav>
  </div>
<button onclick="toggleTheme()" style="background:none;border:1px solid #30363d;color:#8b949e;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px">🌓 Theme</button>
</header>

<main>
  <div class="toolbar">
    <h2 style="font-size:18px;flex:1">🔔 Alert Dashboard</h2>
    <label style="font-size:12px;color:#8b949e;display:flex;align-items:center;gap:4px">
      <input type="checkbox" id="auto-eval" checked onchange="toggleAutoEval()"> Auto-evaluate (30s)
    </label>
    <button class="btn" onclick="evaluateNow()">⚡ Evaluate Now</button>
    <button class="btn" onclick="clearHistory()">🗑 Clear History</button>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="num num-rules" id="stat-rules">-</div><div class="label">Alert Rules</div></div>
    <div class="stat-card"><div class="num num-firing" id="stat-firing">-</div><div class="label">Currently Firing</div></div>
    <div class="stat-card"><div class="num num-ack" id="stat-ack">-</div><div class="label">Acknowledged</div></div>
  </div>

  <h3 style="font-size:14px;margin-bottom:12px;color:#8b949e">Active Alerts</h3>
  <div id="active-list"><div class="empty"><span class="spinner"></span> Loading…</div></div>

  <h3 style="font-size:14px;margin:20px 0 12px;color:#8b949e">Alert History</h3>
  <div id="history-list" class="timeline"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const HIST_KEY = 'fuse-alert-history';
const ACK_KEY = 'fuse-alert-ack';
let evalTimer = null;

function getHistory() { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); }
function saveHistory(h) { localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, 500))); }
function getAcked() { return JSON.parse(localStorage.getItem(ACK_KEY) || '[]'); }
function saveAcked(a) { localStorage.setItem(ACK_KEY, JSON.stringify(a)); }

async function loadRules() {
  try {
    const rules = await (await fetch('/api/fuse/alerts')).json();
    $('stat-rules').textContent = rules.length;
    return rules;
  } catch { $('stat-rules').textContent = '?'; return []; }
}

async function evaluateNow() {
  const el = $('active-list');
  el.innerHTML = '<div class="empty"><span class="spinner"></span> Evaluating…</div>';
  try {
    const res = await (await fetch('/api/fuse/alerts/evaluate', { method: 'POST' })).json();
    const firing = res.firing || [];
    const acked = getAcked();
    $('stat-firing').textContent = firing.length;

    // Record in history
    const hist = getHistory();
    const now = Date.now();
    firing.forEach(a => {
      hist.unshift({ name: a.name || a.rule, type: 'firing', timestamp: now, rows: a.row_count || 0 });
    });
    if (!firing.length) {
      hist.unshift({ name: 'All clear', type: 'ok', timestamp: now });
    }
    saveHistory(hist);

    if (!firing.length) {
      el.innerHTML = '<div class="empty" style="color:#3fb950">✓ No alerts firing</div>';
    } else {
      el.innerHTML = firing.map(a => {
        const name = a.name || a.rule;
        const isAcked = acked.includes(name);
        return `<div class="card">
          <div class="icon">${isAcked ? '🔵' : '🔴'}</div>
          <div class="body">
            <h4>${esc(name)}</h4>
            <div class="meta">${a.row_count || 0} rows returned · ${new Date().toLocaleTimeString()}</div>
          </div>
          <span class="badge ${isAcked ? 'badge-ack' : 'badge-firing'}">${isAcked ? 'Acknowledged' : 'Firing'}</span>
          ${!isAcked ? `<button class="btn btn-sm" onclick="ackAlert('${esc(name)}')">Acknowledge</button>` : ''}
        </div>`;
      }).join('');
    }
    renderHistory();
  } catch (e) {
    el.innerHTML = `<div class="empty" style="color:#f85149">Error: ${esc(e.message)}</div>`;
  }
}

function ackAlert(name) {
  const acked = getAcked();
  if (!acked.includes(name)) { acked.push(name); saveAcked(acked); }
  const hist = getHistory();
  hist.unshift({ name, type: 'ack', timestamp: Date.now() });
  saveHistory(hist);
  $('stat-ack').textContent = acked.length;
  evaluateNow();
}

function renderHistory() {
  const hist = getHistory().slice(0, 50);
  $('stat-ack').textContent = getAcked().length;
  if (!hist.length) { $('history-list').innerHTML = '<div class="empty">No alert history yet.</div>'; return; }
  $('history-list').innerHTML = hist.map(h => `
    <div class="event ${h.type}">
      <div style="font-size:13px;color:#e1e4e8">${h.type === 'firing' ? '🔴' : h.type === 'ack' ? '🔵' : '🟢'} <strong>${esc(h.name)}</strong>
        <span class="badge badge-${h.type}">${h.type}</span>
      </div>
      <div style="font-size:11px;color:#484f58">${new Date(h.timestamp).toLocaleString()}${h.rows ? ' · ' + h.rows + ' rows' : ''}</div>
    </div>
  `).join('');
}

function toggleAutoEval() {
  if ($('auto-eval').checked) {
    evalTimer = setInterval(evaluateNow, 30000);
  } else {
    clearInterval(evalTimer);
  }
}

function clearHistory() {
  if (!confirm('Clear all alert history?')) return;
  localStorage.removeItem(HIST_KEY);
  localStorage.removeItem(ACK_KEY);
  renderHistory();
  $('stat-ack').textContent = '0';
}

// Init
loadRules();
evaluateNow();
evalTimer = setInterval(evaluateNow, 30000);
</script>
<script>fetch("/feedback-widget").then(r=>r.text()).then(h=>{const d=document.createElement("div");d.innerHTML=h;document.body.appendChild(d);const s=d.querySelectorAll("script");s.forEach(sc=>{const n=document.createElement("script");n.textContent=sc.textContent;document.body.appendChild(n);});})</script>
</body>
</html>
