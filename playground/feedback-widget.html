<!-- Fuse Feedback Widget — include on any page -->
<style>
#fb-btn{position:fixed;bottom:24px;right:24px;background:#238636;color:#fff;border:none;border-radius:50%;width:48px;height:48px;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:300;transition:transform .2s}
#fb-btn:hover{transform:scale(1.1)}
#fb-panel{position:fixed;bottom:0;right:0;width:380px;max-width:100vw;height:auto;max-height:80vh;background:#161b22;border:1px solid #30363d;border-radius:12px 12px 0 0;box-shadow:0 -8px 32px rgba(0,0,0,.5);z-index:301;transform:translateY(100%);transition:transform .25s ease;overflow-y:auto}
#fb-panel.open{transform:translateY(0)}
#fb-panel .fb-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #21262d}
#fb-panel .fb-header h3{font-size:14px;color:#58a6ff;margin:0}
#fb-panel .fb-close{background:none;border:none;color:#8b949e;font-size:18px;cursor:pointer;padding:0 4px}
#fb-panel .fb-body{padding:16px}
#fb-panel .fb-row{margin-bottom:12px}
#fb-panel .fb-row label{display:block;font-size:12px;color:#8b949e;margin-bottom:4px}
#fb-panel .fb-row select,#fb-panel .fb-row input,#fb-panel .fb-row textarea{width:100%;background:#0d1117;color:#e1e4e8;border:1px solid #30363d;border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit}
#fb-panel .fb-row textarea{min-height:100px;resize:vertical}
#fb-panel .fb-row select:focus,#fb-panel .fb-row input:focus,#fb-panel .fb-row textarea:focus{outline:none;border-color:#58a6ff}
#fb-panel .fb-submit{background:#238636;color:#fff;border:none;border-radius:6px;padding:8px 20px;font-size:13px;font-weight:600;cursor:pointer;width:100%}
#fb-panel .fb-submit:hover{background:#2ea043}
#fb-panel .fb-success{text-align:center;padding:24px;color:#3fb950;font-size:14px}
#fb-panel .fb-history{margin-top:12px;border-top:1px solid #21262d;padding-top:12px}
#fb-panel .fb-history h4{font-size:11px;color:#484f58;text-transform:uppercase;margin-bottom:6px}
#fb-panel .fb-entry{padding:6px 0;border-bottom:1px solid #21262d;font-size:11px;color:#8b949e}
#fb-panel .fb-entry:last-child{border-bottom:none}
#fb-panel .fb-entry .fb-cat{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600;margin-right:4px}
.fb-cat-bug{background:#3a1a1a;color:#f85149}
.fb-cat-feature{background:#1f3a5f;color:#58a6ff}
.fb-cat-question{background:#2d1f3a;color:#bc8cff}
</style>

<button id="fb-btn" onclick="toggleFeedback()" title="Send Feedback">💬</button>

<div id="fb-panel">
  <div class="fb-header">
    <h3>💬 Send Feedback</h3>
    <button class="fb-close" onclick="toggleFeedback()">✕</button>
  </div>
  <div class="fb-body" id="fb-body">
    <div class="fb-row">
      <label>Category</label>
      <select id="fb-cat">
        <option value="bug">🐛 Bug Report</option>
        <option value="feature">✨ Feature Request</option>
        <option value="question">❓ Question</option>
      </select>
    </div>
    <div class="fb-row">
      <label>Description</label>
      <textarea id="fb-desc" placeholder="Tell us what happened or what you'd like to see…"></textarea>
    </div>
    <div class="fb-row">
      <label>Email (optional)</label>
      <input type="email" id="fb-email" placeholder="you@example.com">
    </div>
    <button class="fb-submit" onclick="submitFeedback()">Submit Feedback</button>
    <div class="fb-history" id="fb-history"></div>
  </div>
</div>

<script>
(function() {
  const FB_KEY = 'fuse-feedback';
  const FB_ENDPOINT = ''; // Set to POST endpoint URL if available

  window.toggleFeedback = function() {
    document.getElementById('fb-panel').classList.toggle('open');
    renderFbHistory();
  };

  window.submitFeedback = async function() {
    const cat = document.getElementById('fb-cat').value;
    const desc = document.getElementById('fb-desc').value.trim();
    const email = document.getElementById('fb-email').value.trim();
    if (!desc) { alert('Please enter a description'); return; }

    const entry = { category: cat, description: desc, email: email || null, page: window.location.pathname, timestamp: Date.now(), userAgent: navigator.userAgent };

    // Try POST to endpoint
    if (FB_ENDPOINT) {
      try { await fetch(FB_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(entry) }); } catch {}
    }

    // Always save locally
    const all = JSON.parse(localStorage.getItem(FB_KEY) || '[]');
    all.unshift(entry);
    localStorage.setItem(FB_KEY, JSON.stringify(all.slice(0, 100)));

    // Show success
    document.getElementById('fb-body').innerHTML = '<div class="fb-success">✓ Thank you for your feedback!</div>';
    setTimeout(() => {
      document.getElementById('fb-body').innerHTML = document.getElementById('fb-panel').querySelector('.fb-body')?.innerHTML || '';
      location.reload(); // simplest way to reset form
    }, 2000);
  };

  function renderFbHistory() {
    const el = document.getElementById('fb-history');
    if (!el) return;
    const all = JSON.parse(localStorage.getItem(FB_KEY) || '[]').slice(0, 5);
    if (!all.length) { el.innerHTML = ''; return; }
    el.innerHTML = '<h4>Recent Feedback</h4>' + all.map(e =>
      `<div class="fb-entry"><span class="fb-cat fb-cat-${e.category}">${e.category}</span>${e.description.substring(0, 60)}${e.description.length > 60 ? '…' : ''}<br><span style="font-size:10px;color:#484f58">${new Date(e.timestamp).toLocaleString()} · ${e.page}</span></div>`
    ).join('');
  }
})();
</script>
