<!-- Fuse Feedback Widget — draggable button, SCREENSHOT, console capture -->
<style>
#fb-btn{position:fixed;bottom:24px;right:24px;background:#238636;color:#fff;border:none;border-radius:50%;width:48px;height:48px;font-size:20px;cursor:grab;box-shadow:0 4px 12px rgba(0,0,0,.4);z-index:9000;user-select:none;touch-action:none}
#fb-btn:hover{box-shadow:0 6px 20px rgba(0,0,0,.6)}
#fb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9001}
#fb-modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:520px;max-width:95vw;max-height:90vh;background:#161b22;border:1px solid #30363d;border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.5);z-index:9002;overflow-y:auto}
.fb-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #21262d}
.fb-hdr h3{font-size:15px;color:#58a6ff;margin:0}
.fb-x{background:none;border:none;color:#8b949e;font-size:18px;cursor:pointer}
.fb-bd{padding:16px}
.fb-r{margin-bottom:12px}
.fb-r label{display:block;font-size:12px;color:#8b949e;margin-bottom:4px}
.fb-r select,.fb-r input,.fb-r textarea{width:100%;background:#0d1117;color:#e1e4e8;border:1px solid #30363d;border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;box-sizing:border-box}
.fb-r textarea{min-height:80px;resize:vertical}
.fb-go{background:#238636;color:#fff;border:none;border-radius:6px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;width:100%;margin-top:4px}
.fb-go:hover{background:#2ea043}
.fb-sec{font-size:11px;color:#484f58;text-transform:uppercase;font-weight:600;margin:14px 0 6px;letter-spacing:.5px}
.fb-info{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:8px 10px;font-size:11px;color:#8b949e;font-family:"SF Mono",Consolas,monospace;max-height:100px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.fb-err{color:#f85149}
.fb-img{max-width:100%;max-height:160px;border:1px solid #30363d;border-radius:6px;margin-top:6px;cursor:pointer}
.fb-ok{text-align:center;padding:32px;color:#3fb950;font-size:15px}
body.light #fb-modal{background:#fff;border-color:#d1d9e0}
body.light .fb-r select,body.light .fb-r input,body.light .fb-r textarea{background:#fff;color:#1f2328;border-color:#d1d9e0}
body.light .fb-info{background:#f6f8fa;border-color:#d1d9e0;color:#656d76}
</style>

<button id="fb-btn" title="Send Feedback">💬</button>
<div id="fb-overlay"></div>
<div id="fb-modal">
  <div class="fb-hdr"><h3>💬 Submit Feedback</h3><button class="fb-x" id="fb-close-btn">✕</button></div>
  <div class="fb-bd" id="fb-bd">
    <div class="fb-r"><label>Type</label><select id="fb-type"><option value="bug">🐛 Bug Report</option><option value="feature">✨ Feature Request</option><option value="general">💬 General Feedback</option></select></div>
    <div class="fb-r"><label>Title</label><input id="fb-title" placeholder="Brief summary"></div>
    <div class="fb-r"><label>Description</label><textarea id="fb-desc" placeholder="Details…"></textarea></div>
    <div class="fb-sec">📸 Screenshot</div>
    <div id="fb-ss-box"><span style="font-size:12px;color:#8b949e">Click 💬 to auto-capture</span></div>
    <div class="fb-sec">🔍 Page Context</div>
    <div class="fb-info" id="fb-ctx"></div>
    <div class="fb-sec" id="fb-err-lbl" style="display:none">⚠️ Console Errors</div>
    <div class="fb-info fb-err" id="fb-errs" style="display:none"></div>
    <div style="margin-top:16px"><button class="fb-go" id="fb-go-btn">Submit Feedback</button></div>
  </div>
</div>

<script>
(function(){
var FK='fuse-feedback',ss=null,errs=[];

// ===== CONSOLE ERROR CAPTURE =====
var _ce=console.error;
console.error=function(){
  errs.push({msg:Array.from(arguments).map(String).join(' '),stack:(new Error).stack||'',ts:Date.now()});
  if(errs.length>30)errs.shift();
  _ce.apply(console,arguments);
};
window.addEventListener('error',function(e){errs.push({msg:e.message+' at '+(e.filename||'')+':'+(e.lineno||0),stack:e.error&&e.error.stack||'',ts:Date.now()})});
window.addEventListener('unhandledrejection',function(e){errs.push({msg:'Unhandled: '+String(e.reason),stack:'',ts:Date.now()})});

// ===== DRAGGABLE BUTTON =====
var btn=document.getElementById('fb-btn'),isDrag=false;
btn.addEventListener('pointerdown',function(e){
  isDrag=false;
  var ox=e.clientX-btn.getBoundingClientRect().left;
  var oy=e.clientY-btn.getBoundingClientRect().top;
  btn.setPointerCapture(e.pointerId);
  function onM(ev){
    if(Math.abs(ev.clientX-e.clientX)>3||Math.abs(ev.clientY-e.clientY)>3)isDrag=true;
    if(!isDrag)return;
    btn.style.left=Math.max(0,Math.min(ev.clientX-ox,innerWidth-48))+'px';
    btn.style.top=Math.max(0,Math.min(ev.clientY-oy,innerHeight-48))+'px';
    btn.style.right='auto';btn.style.bottom='auto';
  }
  function onU(){btn.removeEventListener('pointermove',onM);btn.removeEventListener('pointerup',onU);if(!isDrag)openFeedback()}
  btn.addEventListener('pointermove',onM);
  btn.addEventListener('pointerup',onU);
});

// ===== SCREENSHOT via html2canvas (loaded on demand) =====
var h2cLoaded=false,h2cLoading=false;
function ensureH2C(cb){
  if(typeof html2canvas==='function'){cb(true);return}
  if(h2cLoading){var w=setInterval(function(){if(typeof html2canvas==='function'){clearInterval(w);cb(true)}},100);setTimeout(function(){clearInterval(w);cb(typeof html2canvas==='function')},5000);return}
  h2cLoading=true;
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  s.onload=function(){h2cLoaded=true;cb(true)};
  s.onerror=function(){
    // Try alternate CDN
    var s2=document.createElement('script');
    s2.src='https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js';
    s2.onload=function(){h2cLoaded=true;cb(true)};
    s2.onerror=function(){cb(false)};
    document.head.appendChild(s2);
  };
  document.head.appendChild(s);
}

function takeScreenshot(cb){
  var modal=document.getElementById('fb-modal');
  var ov=document.getElementById('fb-overlay');
  // Hide feedback UI
  modal.style.display='none';ov.style.display='none';btn.style.display='none';

  ensureH2C(function(ok){
    if(ok){
      html2canvas(document.body,{
        useCORS:true,allowTaint:true,logging:false,
        scale:Math.min(window.devicePixelRatio,2),
        width:document.documentElement.scrollWidth,
        height:Math.min(document.documentElement.scrollHeight,8000)
      }).then(function(canvas){
        ss=canvas.toDataURL('image/jpeg',0.7);
        btn.style.display='block';
        cb(true);
      }).catch(function(e){
        console.warn('Screenshot failed:',e);
        btn.style.display='block';
        fallbackScreenshot();
        cb(true);
      });
    }else{
      btn.style.display='block';
      fallbackScreenshot();
      cb(true);
    }
  });
}

function fallbackScreenshot(){
  // Canvas-based text screenshot as last resort
  var c=document.createElement('canvas');c.width=640;c.height=480;
  var ctx=c.getContext('2d');
  ctx.fillStyle=document.body.classList.contains('light')?'#fff':'#0d1117';
  ctx.fillRect(0,0,640,480);
  ctx.fillStyle='#58a6ff';ctx.font='bold 16px sans-serif';
  ctx.fillText('Fuse — '+document.title,16,30);
  ctx.fillStyle='#8b949e';ctx.font='13px monospace';
  ctx.fillText(location.pathname+'  '+new Date().toLocaleString(),16,54);
  ctx.fillText('Window: '+innerWidth+'x'+innerHeight+'  Screen: '+screen.width+'x'+screen.height,16,74);
  var main=document.querySelector('main');
  if(main){
    ctx.fillStyle=document.body.classList.contains('light')?'#1f2328':'#e1e4e8';
    ctx.font='12px monospace';
    var lines=main.innerText.substring(0,1000).split('\n').filter(function(l){return l.trim()});
    for(var i=0;i<Math.min(lines.length,22);i++){
      ctx.fillText(lines[i].substring(0,75),16,100+i*16);
    }
  }
  ss=c.toDataURL('image/jpeg',0.85);
}

// ===== OPEN FEEDBACK: screenshot first, then show modal =====
function openFeedback(){
  document.getElementById('fb-ss-box').innerHTML='<span style="font-size:12px;color:#f0883e">📸 Capturing screenshot…</span>';
  takeScreenshot(function(){
    document.getElementById('fb-overlay').style.display='block';
    document.getElementById('fb-modal').style.display='block';
    showScreenshot();
    collectContext();
    showErrors();
  });
}

function showScreenshot(){
  var box=document.getElementById('fb-ss-box');
  if(ss){
    box.innerHTML='<img class="fb-img" src="'+ss+'" onclick="window.open(this.src)" title="Click to enlarge"><br><span style="font-size:10px;color:#3fb950">✓ Screenshot captured</span> <button onclick="document.getElementById(\'fb-ss-box\').innerHTML=\'Removed\';ss=null" style="font-size:10px;padding:1px 6px;margin-left:4px;background:#21262d;color:#8b949e;border:1px solid #30363d;border-radius:3px;cursor:pointer">✕</button>';
  }else{
    box.innerHTML='<span style="font-size:12px;color:#f85149">Screenshot capture failed</span>';
  }
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function collectContext(){
  var info=[];
  info.push('Page: '+location.pathname);
  info.push('URL: '+location.href);
  info.push('Title: '+document.title);
  info.push('Time: '+new Date().toISOString());
  info.push('Browser: '+navigator.userAgent.split(') ').pop());
  info.push('Screen: '+screen.width+'x'+screen.height+' @'+devicePixelRatio+'x');
  info.push('Window: '+innerWidth+'x'+innerHeight);
  info.push('Theme: '+(document.body.classList.contains('light')?'light':'dark'));
  var ed=document.getElementById('editor');
  if(ed&&ed.value.trim())info.push('Query: '+ed.value.trim().substring(0,200));
  var fmt=document.getElementById('format-select')||document.getElementById('format')||document.getElementById('fmt');
  if(fmt)info.push('Format: '+fmt.value);
  var main=document.querySelector('main');
  if(main)info.push('Content: '+main.innerText.substring(0,300).replace(/\s+/g,' ').trim());
  document.getElementById('fb-ctx').textContent=info.join('\n');
}

function showErrors(){
  var el=document.getElementById('fb-errs'),lbl=document.getElementById('fb-err-lbl');
  if(errs.length){
    el.textContent=errs.slice(-10).map(function(e){return e.msg+(e.stack?'\n  '+e.stack.split('\n').slice(1,3).join('\n  '):'')}).join('\n\n');
    el.style.display='block';lbl.style.display='block';
  }else{el.style.display='none';lbl.style.display='none'}
}

// ===== CLOSE =====
document.getElementById('fb-overlay').addEventListener('click',closeFeedback);
document.getElementById('fb-close-btn').addEventListener('click',closeFeedback);
function closeFeedback(){document.getElementById('fb-overlay').style.display='none';document.getElementById('fb-modal').style.display='none'}

// ===== SUBMIT =====
document.getElementById('fb-go-btn').addEventListener('click',function(){
  var type=document.getElementById('fb-type').value;
  var title=document.getElementById('fb-title').value.trim();
  var desc=document.getElementById('fb-desc').value.trim();
  if(!title){alert('Please enter a title');return}
  if(!desc){alert('Please enter a description');return}
  var entry={
    type:type,title:title,description:desc,
    screenshot:ss||null,
    page:location.pathname,url:location.href,
    timestamp:Date.now(),userAgent:navigator.userAgent,
    screen:screen.width+'x'+screen.height,
    windowSize:innerWidth+'x'+innerHeight,
    theme:document.body.classList.contains('light')?'light':'dark',
    consoleErrors:errs.slice(-10),
    pageContext:document.getElementById('fb-ctx').textContent
  };
  try{fetch('/api/fuse/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(entry)}).catch(function(){})}catch(e){}
  var local=JSON.parse(JSON.stringify(entry));delete local.screenshot;
  var all=JSON.parse(localStorage.getItem(FK)||'[]');
  all.unshift(local);
  localStorage.setItem(FK,JSON.stringify(all.slice(0,100)));
  ss=null;
  document.getElementById('fb-bd').innerHTML='<div class="fb-ok">✅ Feedback submitted!<br><span style="font-size:12px;color:#8b949e">Thank you for helping improve Fuse.</span></div>';
  setTimeout(function(){closeFeedback();location.reload()},2000);
});
})();
</script>
