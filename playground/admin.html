<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fuse Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f1117;color:#e1e4e8;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid #21262d;background:#161b22}
header h1{font-size:18px;font-weight:600;color:#58a6ff}
.nav-tabs{display:flex;gap:0}.nav-tab{padding:8px 16px;font-size:13px;color:#8b949e;text-decoration:none;border-bottom:2px solid transparent}.nav-tab:hover{color:#e1e4e8}.nav-tab.active{color:#58a6ff;border-bottom-color:#58a6ff;font-weight:600}
main{display:flex;max-width:1200px;width:100%;margin:0 auto;flex:1;min-height:0}
.sidebar{width:200px;border-right:1px solid #21262d;padding:16px 0;flex-shrink:0}
.sidebar a{display:block;padding:8px 20px;font-size:13px;color:#8b949e;text-decoration:none;border-left:2px solid transparent;cursor:pointer}
.sidebar a:hover{color:#e1e4e8;background:#161b22}
.sidebar a.active{color:#58a6ff;border-left-color:#58a6ff;background:#161b22}
.content{flex:1;padding:24px;overflow-y:auto}
.content section{display:none}.content section.active{display:block}
h2{font-size:16px;color:#58a6ff;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #21262d}
select,button,input{background:#21262d;color:#e1e4e8;border:1px solid #30363d;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
input[type="text"],input[type="number"],input[type="password"]{cursor:text;width:100%}
input:focus,select:focus{outline:none;border-color:#58a6ff}
button.primary{background:#238636;border-color:#238636;font-weight:600;color:#fff}
button.danger{background:none;border-color:#f8514933;color:#f85149}
.card{padding:12px;border:1px solid #21262d;border-radius:6px;background:#161b22;margin-bottom:8px}
.card-header{display:flex;justify-content:space-between;align-items:center}
.card-title{font-size:13px;font-weight:600;color:#e1e4e8}
.card-meta{font-size:11px;color:#8b949e;margin-top:4px}
.card-actions{display:flex;gap:6px}
.card-actions button{padding:3px 8px;font-size:11px}
.form-row{margin-bottom:10px}
.form-row label{display:block;font-size:12px;color:#8b949e;margin-bottom:4px}
.inline-form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.inline-form .form-row{margin-bottom:0;flex:1;min-width:100px}
.empty{color:#484f58;font-size:13px;padding:20px;text-align:center;border:1px dashed #21262d;border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
th{text-align:left;padding:6px 8px;border-bottom:2px solid #30363d;color:#8b949e;font-size:11px;text-transform:uppercase}
td{padding:6px 8px;border-bottom:1px solid #21262d}
.badge{font-size:10px;padding:1px 6px;border-radius:3px;font-weight:600}
.badge-admin{background:#1f3a5f;color:#58a6ff}
.badge-user{background:#2d1f3a;color:#bc8cff}
.badge-ok{background:#1a3a2a;color:#3fb950}
.badge-err{background:#3a1a1a;color:#f85149}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:16px}
.stat-card{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:12px;text-align:center}
.stat-num{font-size:24px;font-weight:700;color:#e1e4e8}
.stat-label{font-size:11px;color:#8b949e;margin-top:2px}
.search-bar{display:flex;gap:8px;margin-bottom:12px}
.search-bar input{flex:1}
.toast{position:fixed;bottom:24px;right:24px;background:#238636;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;display:none;z-index:100}
.toast.show{display:block}
.admin-badge{background:#d29922;color:#0d1117;font-size:10px;padding:1px 6px;border-radius:3px;font-weight:700;margin-left:8px}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:16px">
    <h1>Fuse <span class="admin-badge">ADMIN</span></h1>
    <nav class="nav-tabs">
      <a href="/playground" class="nav-tab">Playground</a>
      <a href="/dashboard" class="nav-tab">Dashboard</a>
      <a href="/status" class="nav-tab">Status</a>
      <a href="/admin" class="nav-tab active">Admin</a>
    </nav>
  </div>
</header>

<main>
  <div class="sidebar">
    <a class="active" onclick="show('tenants')">👥 Tenants</a>
    <a onclick="show('audit')">📋 Audit Log</a>
    <a onclick="show('keys')">🔑 API Keys</a>
    <a onclick="show('cache')">💾 Cache</a>
  </div>

  <div class="content">
    <!-- Tenants -->
    <section id="s-tenants" class="active">
      <h2>👥 Tenant Management</h2>
      <div id="tenant-list"></div>
      <div class="inline-form" style="margin-top:12px">
        <div class="form-row"><label>Tenant Name</label><input type="text" id="t-name" placeholder="acme-team"></div>
        <div class="form-row"><label>Role</label><select id="t-role"><option value="user">User</option><option value="admin">Admin</option></select></div>
        <div class="form-row"><label>Datasource Access</label><input type="text" id="t-access" placeholder="cluster_a, cluster_b"></div>
        <div class="form-row"><label>Query Limit/min</label><input type="number" id="t-limit" placeholder="100"></div>
        <button class="primary" onclick="addTenant()" style="align-self:flex-end">Add Tenant</button>
      </div>
    </section>

    <!-- Audit Log -->
    <section id="s-audit">
      <h2>📋 Audit Log</h2>
      <div class="search-bar">
        <input type="text" id="audit-search" placeholder="Search by identity, action, or status…" oninput="renderAudit()">
        <select id="audit-filter" onchange="renderAudit()">
          <option value="">All actions</option>
          <option value="query">Query</option>
          <option value="login">Login</option>
          <option value="config">Config Change</option>
          <option value="key">API Key</option>
        </select>
      </div>
      <div id="audit-table"></div>
    </section>

    <!-- API Keys -->
    <section id="s-keys">
      <h2>🔑 API Key Management</h2>
      <div id="key-list"></div>
      <div class="inline-form" style="margin-top:12px">
        <div class="form-row"><label>Key Name</label><input type="text" id="k-name" placeholder="ci-pipeline"></div>
        <div class="form-row"><label>Role</label><select id="k-role"><option value="user">User</option><option value="admin">Admin</option></select></div>
        <div class="form-row"><label>Rate Limit/min</label><input type="number" id="k-rate" placeholder="60"></div>
        <button class="primary" onclick="createKey()" style="align-self:flex-end">Create Key</button>
      </div>
    </section>

    <!-- Cache -->
    <section id="s-cache">
      <h2>💾 Cache Management</h2>
      <div class="stat-grid" id="cache-stats"></div>
      <div style="display:flex;gap:8px">
        <button onclick="refreshCache()">↻ Refresh Stats</button>
        <button class="danger" onclick="clearCache()">Clear All Cache</button>
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin;
const $ = id => document.getElementById(id);
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg) { const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000); }

function show(id) {
  document.querySelectorAll('.content section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'));
  document.getElementById('s-'+id).classList.add('active');
  event.target.classList.add('active');
}

// === Tenants ===
const TENANT_KEY = 'fuse-admin-tenants';
function getTenants() { try{return JSON.parse(localStorage.getItem(TENANT_KEY)||'[]');}catch{return[];} }
function saveTenants(t) { localStorage.setItem(TENANT_KEY,JSON.stringify(t)); }

function renderTenants() {
  const tenants = getTenants();
  if (!tenants.length) { $('tenant-list').innerHTML='<div class="empty">No tenants configured</div>'; return; }
  $('tenant-list').innerHTML = tenants.map((t,i) => `<div class="card"><div class="card-header"><div>
    <div class="card-title">${esc(t.name)} <span class="badge badge-${t.role}">${t.role}</span></div>
    <div class="card-meta">Access: ${esc(t.access)} · Limit: ${t.limit}/min</div>
  </div><div class="card-actions">
    <button class="danger" onclick="removeTenant(${i})">Remove</button>
  </div></div></div>`).join('');
}

function addTenant() {
  const name=$('t-name').value.trim(); if(!name){alert('Name required');return;}
  const tenants=getTenants();
  tenants.push({name,role:$('t-role').value,access:$('t-access').value.trim()||'*',limit:parseInt($('t-limit').value)||100,created:Date.now()});
  saveTenants(tenants); $('t-name').value=''; $('t-access').value=''; $('t-limit').value='';
  addAuditEntry('config','Added tenant: '+name,'ok');
  renderTenants(); toast('Tenant added');
}

function removeTenant(i) {
  const tenants=getTenants(); const name=tenants[i]?.name;
  tenants.splice(i,1); saveTenants(tenants);
  addAuditEntry('config','Removed tenant: '+name,'ok');
  renderTenants(); toast('Tenant removed');
}

// === Audit Log ===
const AUDIT_KEY = 'fuse-admin-audit';
function getAudit() { try{return JSON.parse(localStorage.getItem(AUDIT_KEY)||'[]');}catch{return[];} }
function saveAudit(a) { localStorage.setItem(AUDIT_KEY,JSON.stringify(a.slice(-500))); }

function addAuditEntry(action,detail,status) {
  const audit=getAudit();
  audit.push({timestamp:Date.now(),identity:'admin',action,detail,status});
  saveAudit(audit);
}

function renderAudit() {
  const audit=getAudit().reverse();
  const search=($('audit-search').value||'').toLowerCase();
  const filter=$('audit-filter').value;
  const filtered=audit.filter(e=>{
    if(filter&&e.action!==filter) return false;
    if(search&&!`${e.identity} ${e.action} ${e.detail} ${e.status}`.toLowerCase().includes(search)) return false;
    return true;
  }).slice(0,100);
  if(!filtered.length){$('audit-table').innerHTML='<div class="empty">No audit entries</div>';return;}
  let html='<table><thead><tr><th>Time</th><th>Identity</th><th>Action</th><th>Detail</th><th>Status</th></tr></thead><tbody>';
  filtered.forEach(e=>{
    html+=`<tr><td>${new Date(e.timestamp).toLocaleString()}</td><td>${esc(e.identity)}</td><td>${esc(e.action)}</td><td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.detail)}</td><td><span class="badge badge-${e.status==='ok'?'ok':'err'}">${e.status}</span></td></tr>`;
  });
  $('audit-table').innerHTML=html+'</tbody></table>';
}

// === API Keys ===
const KEYS_KEY = 'fuse-admin-keys';
function getKeys() { try{return JSON.parse(localStorage.getItem(KEYS_KEY)||'[]');}catch{return[];} }
function saveKeys(k) { localStorage.setItem(KEYS_KEY,JSON.stringify(k)); }

function renderKeys() {
  const keys=getKeys();
  if(!keys.length){$('key-list').innerHTML='<div class="empty">No API keys</div>';return;}
  $('key-list').innerHTML=keys.map((k,i)=>`<div class="card"><div class="card-header"><div>
    <div class="card-title">${esc(k.name)} <span class="badge badge-${k.role}">${k.role}</span> ${k.revoked?'<span class="badge badge-err">REVOKED</span>':''}</div>
    <div class="card-meta">Key: ${esc(k.key.substring(0,12))}… · Rate: ${k.rate}/min · Created: ${new Date(k.created).toLocaleDateString()}</div>
  </div><div class="card-actions">
    <button onclick="copyAdminKey(${i})">📋</button>
    ${k.revoked?'':`<button class="danger" onclick="revokeKey(${i})">Revoke</button>`}
  </div></div></div>`).join('');
}

function createKey() {
  const name=$('k-name').value.trim()||'default';
  const key='fuse_'+crypto.randomUUID().replace(/-/g,'');
  const keys=getKeys();
  keys.push({name,key,role:$('k-role').value,rate:parseInt($('k-rate').value)||60,created:Date.now(),revoked:false});
  saveKeys(keys); $('k-name').value=''; $('k-rate').value='';
  addAuditEntry('key','Created key: '+name,'ok');
  navigator.clipboard.writeText(key).catch(()=>{});
  renderKeys(); toast('Key created & copied');
}

function revokeKey(i) {
  const keys=getKeys(); keys[i].revoked=true; saveKeys(keys);
  addAuditEntry('key','Revoked key: '+keys[i].name,'ok');
  renderKeys(); toast('Key revoked');
}

function copyAdminKey(i) {
  const k=getKeys()[i];
  if(k) navigator.clipboard.writeText(k.key).then(()=>toast('Copied')).catch(()=>{});
}

// === Cache ===
async function refreshCache() {
  const el=$('cache-stats');
  try {
    const s=await(await fetch(API+'/api/fuse/stats')).json();
    const items=[
      {label:'Cache Entries',value:s.cache_entries??'—'},
      {label:'Hit Rate',value:s.cache_hit_rate!=null?(s.cache_hit_rate*100).toFixed(1)+'%':'—'},
      {label:'Hits',value:s.cache_hits??'—'},
      {label:'Misses',value:s.cache_misses??'—'},
      {label:'Memory',value:s.cache_memory_bytes!=null?(s.cache_memory_bytes/1024/1024).toFixed(1)+' MB':'—'},
      {label:'Evictions',value:s.cache_evictions??'—'},
    ];
    el.innerHTML=items.map(i=>`<div class="stat-card"><div class="stat-num">${i.value}</div><div class="stat-label">${i.label}</div></div>`).join('');
  } catch { el.innerHTML='<div class="empty">Cache stats unavailable</div>'; }
}

function clearCache() {
  if(!confirm('Clear all cached query results?')) return;
  addAuditEntry('config','Cleared query cache','ok');
  toast('Cache clear requested (requires server API)');
  renderAudit();
}

// === Init ===
renderTenants(); renderAudit(); renderKeys(); refreshCache();
</script>
<script>fetch("/feedback-widget").then(r=>r.text()).then(h=>{const d=document.createElement("div");d.innerHTML=h;document.body.appendChild(d);const s=d.querySelectorAll("script");s.forEach(sc=>{const n=document.createElement("script");n.textContent=sc.textContent;document.body.appendChild(n);});})</script>
</body>
</html>
