<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fuse — Plugins</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f1117;color:#e1e4e8;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid #21262d;background:#161b22}
header h1{font-size:18px;font-weight:600;color:#58a6ff}
.nav-tabs{display:flex;gap:0}.nav-tab{padding:8px 16px;font-size:13px;color:#8b949e;text-decoration:none;border-bottom:2px solid transparent}.nav-tab:hover{color:#e1e4e8}.nav-tab.active{color:#58a6ff;border-bottom-color:#58a6ff;font-weight:600}
main{max-width:960px;margin:0 auto;padding:24px}
.toolbar{display:flex;gap:12px;margin-bottom:16px;align-items:center}
.btn{padding:8px 16px;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#e1e4e8;font-size:13px;cursor:pointer;font-weight:500}
.btn:hover{border-color:#58a6ff}.btn-primary{background:#238636;border-color:#238636;color:#fff}.btn-primary:hover{background:#2ea043}
.btn-sm{padding:4px 10px;font-size:12px}
.card{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:16px;margin-bottom:12px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.card-header h3{font-size:14px;color:#e1e4e8;font-weight:600}
.badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600}
.badge-active{background:#1a3a2a;color:#3fb950}
.badge-disabled{background:#21262d;color:#484f58}
.badge-wasm{background:#1f3a5f;color:#58a6ff}
.meta{font-size:11px;color:#484f58;margin-top:4px}
.empty{text-align:center;padding:48px;color:#484f58;font-size:14px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.upload-zone{border:2px dashed #30363d;border-radius:8px;padding:32px;text-align:center;color:#484f58;cursor:pointer;transition:border-color .2s}
.upload-zone:hover,.upload-zone.dragover{border-color:#58a6ff;color:#8b949e}
.hidden{display:none}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:16px">
    <h1>Fuse</h1>
    <nav class="nav-tabs">
      <a href="/playground" class="nav-tab">Playground</a>
      <a href="/dashboard" class="nav-tab">Dashboard</a>
      <a href="/explore" class="nav-tab">Explore</a>
      <a href="/views" class="nav-tab">Views</a>
      <a href="/plugins" class="nav-tab active">Plugins</a>
      <a href="/settings" class="nav-tab">Settings</a>
      <a href="/help" class="nav-tab">Help</a>
    </nav>
  </div>
</header>

<main>
  <div class="toolbar">
    <h2 style="font-size:18px;flex:1">🧩 Plugins</h2>
    <button class="btn" onclick="loadPlugins()">↻ Refresh</button>
    <button class="btn btn-primary" onclick="toggleUpload()">+ Upload Plugin</button>
  </div>

  <div id="upload-area" class="hidden" style="margin-bottom:16px">
    <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()"
         ondragover="event.preventDefault();this.classList.add('dragover')"
         ondragleave="this.classList.remove('dragover')"
         ondrop="event.preventDefault();this.classList.remove('dragover');handleUpload(event.dataTransfer.files[0])">
      <div style="font-size:24px;margin-bottom:8px">📦</div>
      <div>Drop a <span class="badge badge-wasm">.wasm</span> plugin here or click to browse</div>
      <div class="meta" style="margin-top:8px">Plugins must implement the FederatedConnector interface</div>
    </div>
    <input type="file" id="file-input" accept=".wasm" style="display:none" onchange="handleUpload(this.files[0])">
  </div>

  <div id="plugin-list"><div class="empty"><span class="spinner"></span> Loading…</div></div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function toggleUpload() { $('upload-area').classList.toggle('hidden'); }

async function loadPlugins() {
  const el = $('plugin-list');
  el.innerHTML = '<div class="empty"><span class="spinner"></span> Loading…</div>';
  try {
    const res = await fetch('/api/fuse/plugins');
    if (!res.ok) throw new Error(res.status === 404 ? 'Plugin API not available yet — backend support coming soon' : await res.text());
    const plugins = await res.json();
    if (!plugins.length) {
      el.innerHTML = '<div class="empty">🧩 No plugins installed.<br><span style="font-size:12px;color:#484f58">Upload a WASM connector plugin to extend Fuse.</span></div>';
      return;
    }
    el.innerHTML = plugins.map(p => `
      <div class="card">
        <div class="card-header">
          <h3>🧩 ${esc(p.name)}</h3>
          <div>
            <span class="badge badge-wasm">WASM</span>
            <span class="badge ${p.enabled !== false ? 'badge-active' : 'badge-disabled'}">${p.enabled !== false ? '● Active' : '○ Disabled'}</span>
          </div>
        </div>
        ${p.description ? `<div class="meta">${esc(p.description)}</div>` : ''}
        ${p.version ? `<div class="meta">v${esc(p.version)}</div>` : ''}
        <div style="display:flex;gap:6px;margin-top:8px">
          <button class="btn btn-sm" onclick="togglePlugin('${esc(p.name)}',${p.enabled === false})">${p.enabled !== false ? 'Disable' : 'Enable'}</button>
          <button class="btn btn-sm" style="color:#f85149" onclick="removePlugin('${esc(p.name)}')">Remove</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    el.innerHTML = `<div class="empty" style="color:#d29922">⚠ ${esc(e.message)}</div>`;
  }
}

async function handleUpload(file) {
  if (!file) return;
  if (!file.name.endsWith('.wasm')) { alert('Only .wasm files supported'); return; }
  try {
    const form = new FormData();
    form.append('plugin', file);
    const res = await fetch('/api/fuse/plugins', { method: 'POST', body: form });
    if (!res.ok) throw new Error(await res.text());
    $('upload-area').classList.add('hidden');
    loadPlugins();
  } catch (e) { alert('Upload failed: ' + e.message); }
}

async function togglePlugin(name, enable) {
  try {
    await fetch(`/api/fuse/plugins/${encodeURIComponent(name)}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled: enable }) });
    loadPlugins();
  } catch (e) { alert('Error: ' + e.message); }
}

async function removePlugin(name) {
  if (!confirm(`Remove plugin "${name}"?`)) return;
  try {
    await fetch(`/api/fuse/plugins/${encodeURIComponent(name)}`, { method: 'DELETE' });
    loadPlugins();
  } catch (e) { alert('Error: ' + e.message); }
}

loadPlugins();
</script>
<script>fetch("/feedback-widget").then(r=>r.text()).then(h=>{const d=document.createElement("div");d.innerHTML=h;document.body.appendChild(d);const s=d.querySelectorAll("script");s.forEach(sc=>{const n=document.createElement("script");n.textContent=sc.textContent;document.body.appendChild(n);});})</script>
</body>
</html>
