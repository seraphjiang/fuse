<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fuse — Federation</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f1117;color:#e1e4e8;min-height:100vh}
header{display:flex;align-items:center;padding:12px 24px;border-bottom:1px solid #21262d;background:#161b22}
header h1{font-size:18px;font-weight:600;color:#58a6ff}
.nav-tabs{display:flex;gap:0;margin-left:16px}.nav-tab{padding:8px 16px;font-size:13px;color:#8b949e;text-decoration:none;border-bottom:2px solid transparent}.nav-tab:hover{color:#e1e4e8}.nav-tab.active{color:#58a6ff;border-bottom-color:#58a6ff;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:24px}
.stats{display:flex;gap:16px;margin-bottom:20px}
.stat-card{flex:1;background:#161b22;border:1px solid #21262d;border-radius:8px;padding:16px;text-align:center}
.stat-card .num{font-size:28px;font-weight:700;margin-bottom:4px}
.stat-card .label{font-size:11px;color:#8b949e;text-transform:uppercase}
.card{background:#161b22;border:1px solid #21262d;border-radius:8px;padding:12px 16px;margin-bottom:8px}
.card h4{font-size:13px;margin-bottom:4px}
.card .meta{font-size:11px;color:#484f58}
.badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;white-space:nowrap}
.badge-ok{background:#1a3a2a;color:#3fb950}
.badge-err{background:#3a1a1a;color:#f85149}
.badge-pending{background:#1f3a5f;color:#58a6ff}
.empty{text-align:center;padding:48px;color:#484f58;font-size:14px}
canvas{width:100%;border:1px solid #21262d;border-radius:8px;margin-bottom:20px}
body.light{background:#fff;color:#1f2328}
body.light header{background:#f6f8fa;border-color:#d1d9e0}
body.light .card,body.light .stat-card{background:#fff;border-color:#d1d9e0}
body.light .nav-tab{color:#656d76}
body.light .nav-tab.active{color:#0969da;border-bottom-color:#0969da}
body.light canvas{border-color:#d1d9e0}
@media(max-width:768px){main{padding:12px}header{flex-wrap:wrap;padding:8px 12px}.nav-tabs{flex-wrap:wrap}.stats{flex-direction:column}}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:0">
    <h1>Fuse</h1>
    <nav class="nav-tabs">
      <a href="/playground" class="nav-tab">Playground</a>
      <a href="/dashboard" class="nav-tab">Dashboard</a>
      <a href="/status" class="nav-tab">Status</a>
      <a href="/federation" class="nav-tab active">Federation</a>
      <a href="/settings" class="nav-tab">Settings</a>
    </nav>
  </div>
  <button onclick="toggleTheme()" style="margin-left:auto;background:none;border:1px solid #30363d;color:#8b949e;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px">🌓 Theme</button>
</header>

<main>
  <h2 style="font-size:16px;margin-bottom:16px">🌐 Federation Topology</h2>

  <div class="stats">
    <div class="stat-card"><div class="num" id="stat-instances" style="color:#58a6ff">-</div><div class="label">Fuse Instances</div></div>
    <div class="stat-card"><div class="num" id="stat-datasources" style="color:#3fb950">-</div><div class="label">Total Datasources</div></div>
    <div class="stat-card"><div class="num" id="stat-healthy" style="color:#3fb950">-</div><div class="label">Healthy</div></div>
  </div>

  <canvas id="topo-canvas" height="300"></canvas>

  <h3 style="font-size:14px;margin-bottom:12px;color:#8b949e">Connected Instances</h3>
  <div id="instance-list"><div class="empty">Loading federation topology…</div></div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function loadTopology() {
  try {
    const res = await (await fetch('/api/fuse/federation')).json();
    const instances = res.instances || res || [];
    renderStats(instances);
    renderTopology(instances);
    renderList(instances);
  } catch {
    // Endpoint not yet available — show local instance from health + datasources
    await loadLocalFallback();
  }
}

async function loadLocalFallback() {
  try {
    const [health, datasources] = await Promise.all([
      fetch('/api/fuse/health').then(r => r.json()),
      fetch('/api/fuse/datasources').then(r => r.json()),
    ]);
    const local = {
      id: 'local',
      name: 'This Instance',
      url: window.location.origin,
      status: health.status === 'healthy' ? 'ok' : 'degraded',
      datasources: (datasources || []).map(d => d.name || d.id),
      connectors: health.connectors || {},
    };
    renderStats([local]);
    renderTopology([local]);
    renderList([local]);
  } catch (e) {
    $('instance-list').innerHTML = `<div class="empty" style="color:#f85149">Cannot reach server: ${esc(e.message)}</div>`;
  }
}

function renderStats(instances) {
  const totalDs = instances.reduce((s, i) => s + (i.datasources || []).length, 0);
  const healthy = instances.filter(i => i.status === 'ok' || i.status === 'healthy').length;
  $('stat-instances').textContent = instances.length;
  $('stat-datasources').textContent = totalDs;
  $('stat-healthy').textContent = healthy;
}

function renderTopology(instances) {
  const canvas = $('topo-canvas');
  canvas.width = canvas.parentElement.clientWidth || 800;
  const ctx = canvas.getContext('2d');
  const isLight = document.body.classList.contains('light');
  const textColor = isLight ? '#1f2328' : '#e1e4e8';
  const subColor = isLight ? '#656d76' : '#8b949e';
  const edgeColor = isLight ? '#afb8c1' : '#30363d';
  const n = instances.length;
  if (!n) { canvas.height = 60; ctx.fillStyle = subColor; ctx.font = '13px -apple-system,sans-serif'; ctx.fillText('No instances', canvas.width/2 - 40, 35); return; }

  const nodeR = 30, padY = 60;
  canvas.height = Math.max(200, n > 1 ? 300 : 180);
  const cx = canvas.width / 2, cy = canvas.height / 2;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Position nodes in a circle (or center if single)
  const positions = instances.map((inst, i) => {
    if (n === 1) return { x: cx, y: cy, inst };
    const angle = (2 * Math.PI * i / n) - Math.PI / 2;
    const rx = Math.min(canvas.width * 0.35, 250), ry = Math.min(canvas.height * 0.35, 100);
    return { x: cx + rx * Math.cos(angle), y: cy + ry * Math.sin(angle), inst };
  });

  // Draw edges between all instances (mesh topology)
  ctx.strokeStyle = edgeColor;
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  for (let i = 0; i < positions.length; i++) {
    for (let j = i + 1; j < positions.length; j++) {
      ctx.beginPath();
      ctx.moveTo(positions[i].x, positions[i].y);
      ctx.lineTo(positions[j].x, positions[j].y);
      ctx.stroke();
    }
  }
  ctx.setLineDash([]);

  // Draw nodes
  positions.forEach(p => {
    const ok = p.inst.status === 'ok' || p.inst.status === 'healthy';
    const color = ok ? '#3fb950' : '#f85149';
    // Glow
    ctx.beginPath();
    ctx.arc(p.x, p.y, nodeR + 4, 0, Math.PI * 2);
    ctx.fillStyle = color + '22';
    ctx.fill();
    // Circle
    ctx.beginPath();
    ctx.arc(p.x, p.y, nodeR, 0, Math.PI * 2);
    ctx.fillStyle = isLight ? '#f6f8fa' : '#161b22';
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    // Icon
    ctx.fillStyle = textColor;
    ctx.font = '16px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🔗', p.x, p.y + 5);
    // Label
    ctx.font = 'bold 11px -apple-system,sans-serif';
    ctx.fillStyle = textColor;
    ctx.fillText(p.inst.name || p.inst.id || '?', p.x, p.y + nodeR + 16);
    // Datasource count
    ctx.font = '10px -apple-system,sans-serif';
    ctx.fillStyle = subColor;
    const dsCount = (p.inst.datasources || []).length;
    ctx.fillText(dsCount + ' datasource' + (dsCount !== 1 ? 's' : ''), p.x, p.y + nodeR + 28);
    ctx.textAlign = 'start';
  });
}

function renderList(instances) {
  if (!instances.length) { $('instance-list').innerHTML = '<div class="empty">No federated instances found.</div>'; return; }
  $('instance-list').innerHTML = instances.map(inst => {
    const ok = inst.status === 'ok' || inst.status === 'healthy';
    const ds = (inst.datasources || []);
    return `<div class="card" style="display:flex;align-items:center;gap:12px">
      <div style="font-size:24px">${ok ? '🟢' : '🔴'}</div>
      <div style="flex:1;min-width:0">
        <h4>${esc(inst.name || inst.id)} <span class="badge ${ok ? 'badge-ok' : 'badge-err'}">${inst.status || '?'}</span></h4>
        <div class="meta">${inst.url ? esc(inst.url) + ' · ' : ''}${ds.length} datasource${ds.length !== 1 ? 's' : ''}${ds.length ? ': ' + ds.map(d => esc(d)).join(', ') : ''}</div>
      </div>
    </div>`;
  }).join('');
}

// Init
loadTopology();
// Theme
(function(){var t=localStorage.getItem("fuse-theme");if(t==="light"||(!t&&window.matchMedia("(prefers-color-scheme:light)").matches))document.body.classList.add("light");})();
function toggleTheme(){document.body.classList.toggle("light");localStorage.setItem("fuse-theme",document.body.classList.contains("light")?"light":"dark");}
</script>
<script>fetch("/feedback-widget").then(r=>r.text()).then(h=>{const d=document.createElement("div");d.innerHTML=h;document.body.appendChild(d);const s=d.querySelectorAll("script");s.forEach(sc=>{const n=document.createElement("script");n.textContent=sc.textContent;document.body.appendChild(n);});})</script>
</body>
</html>
