# Fuse — Federated Query Engine Configuration
# Playground deployment: fuse.huanji.profile.aws.dev

[engine]
bind = "0.0.0.0:9400"
max_concurrent_queries = 64
default_timeout = "30s"
# Rate limiting (requests per minute). Set to 0 to disable.
rate_limit_global = 1000
rate_limit_per_ip = 100

# ── OpenSearch Serverless Connectors (us-west-2) ──

[[connector]]
id = "cluster_a"
type = "opensearch"
url = "https://epk7ap540halh4ufyff6.us-west-2.aoss.amazonaws.com"
max_concurrent_queries = 16
scroll_size = 1000
request_timeout = "30s"

[connector.auth]
type = "sigv4"
region = "us-west-2"
service = "aoss"

[[connector]]
id = "cluster_b"
type = "opensearch"
url = "https://wg2fj60hpfsc9ziwv0u0.us-west-2.aoss.amazonaws.com"
max_concurrent_queries = 16
scroll_size = 1000
request_timeout = "30s"

[connector.auth]
type = "sigv4"
region = "us-west-2"
service = "aoss"

# ── S3 O11y Connector ──

[[connector]]
id = "s3_o11y"
type = "s3-o11y"
bucket = "s3-query-logs-544277935543-us-west-1"
prefix = "fuse/"
region = "us-west-1"

# ── DynamoDB Connector ──

[[connector]]
id = "dynamodb"
type = "dynamodb"
table_prefix = "fuse_"

# ── CloudWatch Logs Connector ──

[[connector]]
id = "cloudwatch"
type = "cloudwatch"
log_group = "/aws/lambda/fuse-demo-processor"
region = "us-west-2"

# ── CSV/JSON on S3 Connector ──

[[connector]]
id = "s3_demo"
type = "csv-json"
bucket = "fuse-demo-544277935543"
prefix = ""
region = "us-west-2"
