# Fuse — Federated Query Engine Configuration
# Playground deployment: fuse.huanji.profile.aws.dev

[engine]
bind = "0.0.0.0:9400"
max_concurrent_queries = 64
default_timeout = "30s"
# Rate limiting (requests per minute). Set to 0 to disable.
rate_limit_global = 1000
rate_limit_per_ip = 100
# CORS: allowed origins. Empty = same-origin only. ["*"] = any origin.
cors_origins = []
# Max result size in bytes. 0 = unlimited. Default: 100MB.
max_result_bytes = 104857600

# ── Cache tuning ──
# [engine.cache]
# max_entries = 1024              # Query result cache max entries
# max_bytes = 268435456           # Query result cache memory budget (256MB)
# plan_cache_ttl_secs = 300       # Plan cache TTL
# plan_cache_max_entries = 1000   # Plan cache max entries
# result_cache_ttl_secs = 60      # Result cache TTL
# result_cache_max_entries = 500  # Result cache max entries

# ── Telemetry (OpenTelemetry OTLP export) ──
# [engine.telemetry]
# enabled = false
# otlp_endpoint = "http://localhost:4317"
# service_name = "fuse"

# ── Per-connector TLS/mTLS (optional) ──
# Any [[connector]] can include a [connector.tls] section:
#
# [connector.tls]
# ca_cert     = "/path/to/ca.pem"        # Custom CA for server verification
# client_cert = "/path/to/client.pem"    # Client certificate (mTLS)
# client_key  = "/path/to/client-key.pem" # Client private key (mTLS)

# ── Secret Management ──
# Any property value (including nested auth blocks) can reference
# AWS Secrets Manager via the secret:// prefix:
#
# url = "secret://fuse/prod/opensearch-url"
#
# [connector.auth]
# type = "basic"
# username = "admin"
# password = "secret://fuse/prod/opensearch-password"
#
# Supported: secret://name, secret://path/name, secret://arn:aws:secretsmanager:...

# ── OpenSearch Serverless Connectors (us-west-2) ──

[[connector]]
id = "cluster_a"
type = "opensearch"
url = "https://epk7ap540halh4ufyff6.us-west-2.aoss.amazonaws.com"
max_concurrent_queries = 16
scroll_size = 1000
request_timeout = "30s"

[connector.auth]
type = "sigv4"
region = "us-west-2"
service = "aoss"

[[connector]]
id = "cluster_b"
type = "opensearch"
url = "https://wg2fj60hpfsc9ziwv0u0.us-west-2.aoss.amazonaws.com"
max_concurrent_queries = 16
scroll_size = 1000
request_timeout = "30s"

[connector.auth]
type = "sigv4"
region = "us-west-2"
service = "aoss"

# ── S3 O11y Connector ──

[[connector]]
id = "s3_o11y"
type = "s3-o11y"
bucket = "s3-query-logs-544277935543-us-west-1"
prefix = "fuse/"
region = "us-west-1"

# ── DynamoDB Connector ──

[[connector]]
id = "dynamodb"
type = "dynamodb"
table_prefix = "fuse_"

# ── CloudWatch Logs Connector ──

[[connector]]
id = "cloudwatch"
type = "cloudwatch"
log_group = "/aws/lambda/fuse-demo-processor"
region = "us-west-2"

# ── CSV/JSON on S3 Connector ──

[[connector]]
id = "s3_demo"
type = "csv-json"
bucket = "fuse-demo-544277935543"
prefix = ""
region = "us-west-2"

# ── OpenTelemetry Collector Mode ──
# Enables Fuse as an OTLP HTTP backend. Applications send traces/metrics/logs
# to /v1/traces, /v1/metrics, /v1/logs and query them with SQL via otel.spans,
# otel.metrics, otel.logs. Health at /v1/health.
#
# Configure your OTel SDK:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:9400
#   OTEL_EXPORTER_OTLP_PROTOCOL=http/json

[[connector]]
id = "otel"
type = "otel"
[connector.properties]
max_spans = 100000
max_metrics = 100000
max_logs = 100000

# ── Column-Level RBAC ──
# Restrict access to sensitive columns per role. When enabled, denied fields
# are stripped from results and masked fields show "****".
#
# [security]
# enabled = true
#
