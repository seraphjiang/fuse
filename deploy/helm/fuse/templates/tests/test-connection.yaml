apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "fuse.fullname" . }}-test-connection"
  labels: {{- include "fuse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: public.ecr.aws/docker/library/curlimages/curl:8.7.1
      command: ["curl", "-sf", "http://{{ include "fuse.fullname" . }}:{{ .Values.service.port }}/api/fuse/health"]
