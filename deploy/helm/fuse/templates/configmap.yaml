apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fuse.fullname" . }}-config
  labels: {{- include "fuse.labels" . | nindent 4 }}
data:
  fuse.toml: |
    [engine]
    bind = {{ .Values.config.bind | quote }}
    max_concurrent_queries = {{ .Values.config.max_concurrent_queries }}
    default_timeout = {{ .Values.config.default_timeout | quote }}
    {{- range .Values.connectors }}

    [[connector]]
    id = {{ .id | quote }}
    type = {{ .type | quote }}
    {{- range $k, $v := . }}
    {{- if and (ne $k "id") (ne $k "type") }}
    {{ $k }} = {{ $v | quote }}
    {{- end }}
    {{- end }}
    {{- end }}
