apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fuse.fullname" . }}
  labels: {{- include "fuse.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: {{ .Values.deploymentStrategy.type }}
    {{- if eq .Values.deploymentStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.deploymentStrategy.maxSurge | default "25%" | quote }}
      maxUnavailable: {{ .Values.deploymentStrategy.maxUnavailable | default 0 }}
    {{- end }}
  selector:
    matchLabels: {{- include "fuse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.metrics.podAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
        prometheus.io/path: {{ .Values.metrics.serviceMonitor.path | default "/metrics" | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels: {{- include "fuse.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "fuse.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.configValidation.enabled }}
      initContainers:
        - name: config-validator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command: ["/usr/local/bin/fuse-server", "--validate-config"]
          env:
            - name: FUSE_CONFIG
              value: /etc/fuse/fuse.toml
          volumeMounts:
            - name: config
              mountPath: /etc/fuse
              readOnly: true
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      {{- end }}
      containers:
        - name: fuse-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9400
              protocol: TCP
          env:
            - name: FUSE_CONFIG
              value: /etc/fuse/fuse.toml
            - name: RUST_LOG
              value: info
            {{- if .Values.telemetry.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlp_endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: fuse-server
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: FUSE_REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- end }}
            {{- if .Values.plugins.enabled }}
            - name: FUSE_PLUGIN_DIR
              value: {{ .Values.plugins.mountPath | quote }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/fuse
              readOnly: true
            {{- if .Values.plugins.enabled }}
            - name: plugins
              mountPath: {{ .Values.plugins.mountPath }}
              readOnly: true
            {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /api/fuse/health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/fuse/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/fuse/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: {{ include "fuse.fullname" . }}-config
      {{- if .Values.plugins.enabled }}
        - name: plugins
          emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
