replicaCount: 2

deploymentStrategy:
  type: RollingUpdate
  maxSurge: "25%"
  maxUnavailable: 0

image:
  repository: ghcr.io/seraphjiang/fuse-server
  tag: ""  # defaults to appVersion
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9400

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: fuse.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleUpStabilization: 60
  scaleDownStabilization: 300

config:
  bind: "0.0.0.0:9400"
  max_concurrent_queries: 64
  default_timeout: "30s"
  cors_origins: []
  max_result_bytes: 104857600  # 100MB
  rate_limit_global: 1000
  rate_limit_per_ip: 100

telemetry:
  enabled: false
  otlp_endpoint: ""

connectors: []
# - id: my_cluster
#   type: opensearch
#   url: "https://opensearch:9200"
#   tls:
#     ca_cert: ""
#
# OTel Collector Mode (#1850) — ingest OTLP traces/metrics/logs on :9400/v1/*
# - id: otel
#   type: otel
#   max_spans: 1000000
#   max_metrics: 1000000
#   max_logs: 1000000

redis:
  enabled: false
  url: "redis://redis:6379"

tenants:
  enabled: false

networkPolicy:
  enabled: false
  allowFrom: []
  # - podSelector:
  #     matchLabels:
  #       app: my-client

plugins:
  enabled: false
  # Directory to load WASM connector plugins from
  # Mount a PVC or ConfigMap with .wasm files + manifest.toml
  mountPath: /etc/fuse/plugins

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

metrics:
  serviceMonitor:
    enabled: false
    interval: "30s"
    scrapeTimeout: "10s"
    path: "/metrics"
    labels: {}
    # release: prometheus  # match your Prometheus operator selector

configValidation:
  enabled: false

resourceQuota:
  enabled: false
  hard:
    requests.cpu: "8"
    requests.memory: 8Gi
    limits.cpu: "16"
    limits.memory: 16Gi
    pods: "20"

blueGreen:
  enabled: false
  activeSlot: "blue"  # "blue" or "green" — toggle to switch traffic

backup:
  enabled: false
  schedule: "0 2 * * *"  # daily at 2am
  historyLimit: 3
  persistentVolumeClaim: ""  # set to PVC name for persistent backups
