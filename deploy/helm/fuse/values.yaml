replicaCount: 2

image:
  repository: ghcr.io/seraphjiang/fuse-server
  tag: ""  # defaults to appVersion
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9400

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: fuse.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

config:
  bind: "0.0.0.0:9400"
  max_concurrent_queries: 64
  default_timeout: "30s"

connectors: []
# - id: my_cluster
#   type: opensearch
#   url: "https://opensearch:9200"

redis:
  enabled: false
  url: "redis://redis:6379"

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
