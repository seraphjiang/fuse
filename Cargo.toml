[workspace]
members = [
    "crates/fuse-core",
    "crates/fuse-engine",
    "crates/fuse-connectors/opensearch",
    "crates/fuse-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/seraphjiang/fuse"

[workspace.dependencies]
# Arrow & DataFusion
arrow = { version = "58", features = ["json"] }
datafusion = "53"
datafusion-federation = { version = "0.5", features = ["sql"] }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP & gRPC
axum = { version = "0.8", features = ["json"] }
tonic = "0.12"
prost = "0.13"

# OpenSearch
opensearch = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"
