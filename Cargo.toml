[workspace]
members = [
    "crates/fuse-core",
    "crates/fuse-engine",
    "crates/fuse-connectors/opensearch",
    "crates/fuse-connectors/s3",
    "crates/fuse-connectors/s3-o11y",
    "crates/fuse-connectors/example",
    "crates/fuse-connectors/prometheus",
    "crates/fuse-connectors/cloudwatch",
    "crates/fuse-connectors/csv-json",
    "crates/fuse-connectors/redis",
    "crates/fuse-connectors/dynamodb",
    "crates/fuse-connector-sdk",
    "crates/fuse-server",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/seraphjiang/fuse"

[workspace.dependencies]
# Arrow & DataFusion
arrow = { version = "58", features = ["json"] }
arrow-csv = "58"
arrow-json = "58"
datafusion = "53"
datafusion-federation = { version = "0.5", features = ["sql"] }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP & gRPC
axum = { version = "0.8", features = ["json"] }
reqwest = { version = "0.12", features = ["json"] }
tonic = "0.12"
prost = "0.13"

# OpenSearch
opensearch = { version = "2", features = ["aws-auth"] }

# S3 & Parquet
aws-sdk-s3 = "1"
aws-sdk-cloudwatchlogs = "1"
aws-sdk-dynamodb = "1"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
redis = { version = "0.27", features = ["tokio-comp", "aio"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
parquet = { version = "58", features = ["arrow", "async"] }
bytes = "1"
flate2 = "1"
base64 = "0.22"
governor = "0.6"
object_store = { version = "0.12", features = ["aws"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"
