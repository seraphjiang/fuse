[workspace]
members = [
    "crates/fuse-core",
    "crates/fuse-engine",
    "crates/fuse-connectors/opensearch",
    "crates/fuse-connectors/s3",
    "crates/fuse-connectors/s3-o11y",
    "crates/fuse-connectors/example",
    "crates/fuse-connectors/prometheus",
    "crates/fuse-connectors/cloudwatch",
    "crates/fuse-connectors/csv-json",
    "crates/fuse-connectors/kafka",
    "crates/fuse-connectors/redis",
    "crates/fuse-connectors/dynamodb",
    "crates/fuse-connectors/postgres",
    "crates/fuse-connectors/elasticsearch",
    "crates/fuse-connectors/mongodb",
    "crates/fuse-connectors/influxdb",
    "crates/fuse-connectors/clickhouse",
    "crates/fuse-connectors/cassandra",
    "crates/fuse-connectors/fuse",
    "crates/fuse-connectors/athena",
    "crates/fuse-connectors/timestream",
    "crates/fuse-connectors/snowflake",
    "crates/fuse-connectors/bigquery",
    "crates/fuse-connectors/arrow-flight",
    "crates/fuse-connectors/spark",
    "crates/fuse-connectors/delta-lake",
    "crates/fuse-connectors/iceberg",
    "crates/fuse-connectors/duckdb",
    "crates/fuse-connectors/otel",
    "crates/fuse-connector-sdk",
    "crates/fuse-server",
    "crates/fuse-cli",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/seraphjiang/fuse"

[workspace.dependencies]
# Arrow & DataFusion
arrow = { version = "58", features = ["json"] }
arrow-flight = { version = "58", features = ["flight-sql-experimental"] }
arrow-csv = "58"
arrow-json = "58"
datafusion = "53"
datafusion-federation = { version = "0.5", features = ["sql"] }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP & gRPC
axum = { version = "0.8", features = ["json"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tonic = "0.12"
prost = "0.14"

# OpenSearch
opensearch = { version = "2", features = ["aws-auth"] }

# S3 & Parquet
aws-sdk-redshift = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-s3 = "1"
aws-sdk-cloudwatchlogs = "1"
aws-sdk-athena = "1"
aws-sdk-timestreamquery = "1"
aws-sdk-timestreamwrite = "1"
aws-sdk-dynamodb = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "json"] }
mongodb = { version = "3", features = ["default"] }
duckdb = { version = "1", features = ["bundled"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
redis = { version = "1.2", features = ["tokio-comp", "aio", "connection-manager"] }
wasmtime = "43"
bb8-redis = "0.26"
bb8 = "0.9"
aws-config = { version = "1", features = ["behavior-version-latest"] }
parquet = { version = "58", features = ["arrow", "async"] }
bytes = "1"
flate2 = "1"
governor = "0.6"
base64 = "0.22"
object_store = { version = "0.12", features = ["aws"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.29", features = ["trace"] }
opentelemetry_sdk = { version = "0.29", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.29", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.30"

# Crypto
sha2 = "0.11"
hex = "0.4"

# Error handling
thiserror = "2"
anyhow = "1"
