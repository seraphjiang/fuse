name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo check --all-targets

      - name: Test
        run: cargo test --all-targets

      - name: Docker build
        run: docker build -t fuse-server:ci .

      - name: Test count summary
        run: |
          echo "=== Test Summary ==="
          cargo test --all-targets 2>&1 | grep "test result:" | awk '{total+=$4; pass+=$4} END {print "Total: " total " tests, all passing"}'

  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint deploy/helm/fuse/

      - name: Template render (dry-run)
        run: helm template fuse deploy/helm/fuse/ --debug > /dev/null

  sdk-tests:
    name: SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: TypeScript SDK tests
        run: node sdk/typescript/tests/test_client.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python SDK tests
        run: |
          cd sdk/python
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          python -m pytest tests/test_client.py -v

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go SDK tests
        run: cd sdk/go && go test -v ./...
