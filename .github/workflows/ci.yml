name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: lint
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: test
      - uses: taiki-e/install-action@nextest
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo nextest run --all-targets --retries 1
      - name: Summary
        if: always()
        run: cargo nextest run --all-targets 2>&1 | tail -5 || true

  chaos-tests:
    name: Chaos & Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: chaos
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Chaos tests
        run: cargo test --test chaos_test -- --test-threads=1
        timeout-minutes: 10
      - name: SQL injection fuzz tests
        run: cargo test --test sql_injection_fuzz_test
        timeout-minutes: 10

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/fuse/
      - run: helm template fuse deploy/helm/fuse/ --debug > /dev/null

  ui-tests:
    name: UI & E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: e2e
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config curl
      - run: cargo build --release --bin fuse-server
      - name: Start server
        run: |
          ./target/release/fuse-server &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            curl -sf http://localhost:9400/api/fuse/health > /dev/null 2>&1 && break
            sleep 1
          done
      - run: bash tests/e2e/playground_test.sh http://localhost:9400
      - run: bash tests/e2e/sprint18_pages_test.sh http://localhost:9400
      - run: bash tests/e2e/admin_ops_pages_test.sh http://localhost:9400
      - run: bash tests/e2e/ops_api_smoke_test.sh http://localhost:9400
      - name: Stop server
        if: always()
        run: kill ${{ env.SERVER_PID }} 2>/dev/null || true

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cov
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo llvm-cov --all-targets --lcov --output-path lcov.info
      - run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 14

  sdk-tests:
    name: SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node sdk/typescript/tests/test_client.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cd sdk/python && pip install -e ".[dev]" 2>/dev/null || pip install -e . && python -m pytest tests/test_client.py -v
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: cd sdk/go && go test -v ./...
