openapi: "3.1.0"
info:
  title: Fuse — Federated Query Engine API
  description: |
    REST API for the Fuse cross-datasource federated query engine.
    Fuse federates queries across multiple OpenSearch clusters (and future
    datasource types) from a single endpoint, using Apache DataFusion for
    SQL planning and push-down optimization.
  version: "0.1.0"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:9400
    description: Local development

paths:
  /api/fuse/health:
    get:
      operationId: getHealth
      summary: Engine and connector health
      tags: [Health]
      responses:
        "200":
          description: Health status of the engine and all registered connectors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: healthy
                version: "0.1.0"
                connectors:
                  prod_cluster:
                    status: healthy
                    latency_ms: 12
                    message: null

  /api/fuse/datasources:
    get:
      operationId: listDatasources
      summary: List registered datasources
      tags: [Datasources]
      responses:
        "200":
          description: Array of registered datasources with capabilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatasourceInfo"

  /api/fuse/datasources/{id}/schemas:
    get:
      operationId: getSchemas
      summary: Discover schemas (indices/tables) for a datasource
      tags: [Datasources]
      parameters:
        - $ref: "#/components/parameters/DatasourceId"
      responses:
        "200":
          description: List of schemas available in the datasource
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SchemaInfo"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/fuse/datasources/{id}/schemas/{table}/fields:
    get:
      operationId: getFields
      summary: Get fields (Arrow schema) for a specific table
      tags: [Datasources]
      parameters:
        - $ref: "#/components/parameters/DatasourceId"
        - name: table
          in: path
          required: true
          schema:
            type: string
          description: Table or index name
      responses:
        "200":
          description: List of fields with types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FieldInfo"
              example:
                - name: trace_id
                  data_type: Utf8
                  nullable: false
                - name: status
                  data_type: Int64
                  nullable: false
                - name: message
                  data_type: Utf8
                  nullable: true
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/fuse/query:
    post:
      operationId: executeQuery
      summary: Execute a federated query
      description: |
        Parses the datasource and table from the query string, routes to the
        appropriate connector, and returns results as JSON rows.

        Supports SQL (`format: sql`) and PPL (`format: ppl`).
      tags: [Query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
            examples:
              sql:
                summary: SQL query
                value:
                  query: "SELECT * FROM prod_cluster.logs WHERE status = 500"
                  format: sql
              ppl:
                summary: PPL query
                value:
                  query: "source = prod_cluster.logs | where status >= 500 | stats count() by service"
                  format: ppl
      responses:
        "200":
          description: Query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
              example:
                columns: [trace_id, status, message]
                rows:
                  - ["abc-001", "500", "internal server error"]
                  - ["abc-003", "500", "gateway timeout"]
                metadata:
                  total_rows: 2
                  format: sql
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/fuse/query/explain:
    post:
      operationId: explainQuery
      summary: Show execution plan for a query
      tags: [Query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Execution plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplainResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/fuse/query/validate:
    post:
      operationId: validateQuery
      summary: Validate a query without executing it
      tags: [Query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
              examples:
                valid:
                  value:
                    valid: true
                invalid:
                  value:
                    valid: false
                    error: "datasource 'unknown' not found in registry"

components:
  parameters:
    DatasourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Datasource connector ID (as defined in fuse.toml)

  schemas:
    QueryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: SQL or PPL query string. Must reference tables as `datasource.table`.
        format:
          type: string
          enum: [sql, ppl]
          default: sql
          description: Query language format

    QueryResponse:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items: {}
        metadata:
          $ref: "#/components/schemas/QueryMetadata"

    QueryMetadata:
      type: object
      properties:
        total_rows:
          type: integer
          format: int64
        format:
          type: string

    DatasourceInfo:
      type: object
      properties:
        id:
          type: string
        connector_type:
          type: string
        capabilities:
          $ref: "#/components/schemas/ConnectorCapabilities"

    ConnectorCapabilities:
      type: object
      properties:
        supports_filtering:
          type: boolean
        supports_projection:
          type: boolean
        supports_aggregation:
          type: boolean
        supports_sorting:
          type: boolean
        supports_limit:
          type: boolean
        supports_join:
          type: boolean
        max_concurrent_queries:
          type: integer
        supports_streaming:
          type: boolean
        latency_class:
          type: string
          enum: [low, medium, high]

    SchemaInfo:
      type: object
      properties:
        name:
          type: string
        schema_type:
          type: string
          enum: [index, table, bucket, collection]
        estimated_row_count:
          type: integer
          format: int64
          nullable: true

    FieldInfo:
      type: object
      properties:
        name:
          type: string
        data_type:
          type: string
          description: Arrow data type (e.g. Utf8, Int64, Float64, Boolean)
        nullable:
          type: boolean

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        version:
          type: string
        connectors:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ConnectorHealthInfo"

    ConnectorHealthInfo:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        latency_ms:
          type: integer
          format: int64
          nullable: true
        message:
          type: string
          nullable: true

    ExplainResponse:
      type: object
      properties:
        plan:
          type: string

    ValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
        error:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Invalid request (parse error, missing fields)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Datasource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server or connector error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

tags:
  - name: Health
    description: Server and connector health checks
  - name: Datasources
    description: Datasource discovery and schema introspection
  - name: Query
    description: Query execution, explain, and validation
