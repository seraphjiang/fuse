[package]
name = "fuse-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP API server for the Fuse federated query engine"

[dependencies]
fuse-core = { path = "../fuse-core" }
fuse-engine = { path = "../fuse-engine" }
fuse-connector-opensearch = { path = "../fuse-connectors/opensearch" }
fuse-connector-s3-o11y = { path = "../fuse-connectors/s3-o11y" }
fuse-connector-dynamodb = { path = "../fuse-connectors/dynamodb" }
fuse-connector-postgres = { path = "../fuse-connectors/postgres" }
fuse-connector-duckdb = { path = "../fuse-connectors/duckdb" }
fuse-connector-otel = { path = "../fuse-connectors/otel" }
fuse-connector-elasticsearch = { path = "../fuse-connectors/elasticsearch" }
fuse-connector-mongodb = { path = "../fuse-connectors/mongodb" }
fuse-connector-influxdb = { path = "../fuse-connectors/influxdb" }
fuse-connector-clickhouse = { path = "../fuse-connectors/clickhouse" }
fuse-connector-cloudwatch = { path = "../fuse-connectors/cloudwatch" }
fuse-connector-csv-json = { path = "../fuse-connectors/csv-json" }
fuse-connector-redis = { path = "../fuse-connectors/redis" }
fuse-connector-delta-lake = { path = "../fuse-connectors/delta-lake" }
fuse-connector-iceberg = { path = "../fuse-connectors/iceberg" }
redis = { workspace = true }
wasmtime = { workspace = true }
arrow = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tokio-stream = "0.1"
futures-util = "0.3"
async-stream = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-full"] }
tower = { version = "0.5", features = ["util", "limit"] }
governor = { version = "0.10", features = ["std", "dashmap"] }
async-graphql = "7"
async-graphql-axum = "7"
anyhow = { workspace = true }
async-trait = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
hmac = "0.13"
url = "2"
hex = { workspace = true }
regex = "1"

[dev-dependencies]
fuse-connector-kafka = { path = "../fuse-connectors/kafka" }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "server_bench"
harness = false
